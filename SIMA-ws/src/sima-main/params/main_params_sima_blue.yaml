sima_navigator:
  ros__parameters:
    sima_id: 3

    # adjusting phase
    pre_pos_fwd1_sec: 1.3
    pre_pos_fwd1_speed: 0.15
    pre_pos_spin1_sec: 1.4
    pre_pos_spin1_speed: -1.5  # 負數向右轉
    pre_pos_fwd2_sec: 1.3      # 第二段走比較久
    pre_pos_fwd2_speed: 0.15    # 第二段速度稍快
    pre_pos_spin2_sec: 1.0
    pre_pos_spin2_speed: 1.5   # 正數向左轉

    # sprinting phase
    sprint_duration_sec: 3.0
    sprint_speed: 0.37
    start_delay_seconds: 1.0

    # for only sima 004
    seq_spin_duration_sec: 1.5   # 旋轉要花幾秒
    seq_spin_speed: -1.5         # 旋轉速度 (負數為向右，正數向左)
    seq_forward2_duration_sec: 4.4 # 第二次前進要走幾秒
    seq_forward2_speed: 0.3      # 第二次前進的速度

    # pease
    pantry_A_waypoints: [1.5, 0.5, 2.3, 0.8]  # no use
    pantry_B_waypoints: [1.5, 0.4, 0.77, 0.18]  # finish 2
    pantry_C_waypoints: [0.92, 0.92]   # no use
    pantry_D_waypoints: [1.8, 1.0, 1.37, 1.3]   # finish
    pantry_E_waypoints: [1.6, 0.18]  # finish 2
    pantry_F_waypoints: [1.55, 0.72]  # finish 2
    pantry_G_waypoints: [2.5, 1.4, 1.89, 1.47]  # ignore
    pantry_H_waypoints: [2.27, 0.7]   # finish 2
    pantry_I_waypoints: [2.4, 0.18]    # finish 2
    pantry_J_waypoints: [2.78, 0.75]   # finish 2

    # normal
    pantry_A_waypoints_normal: [0.3, 1.0, 0.15, 0.85]   # no use
    pantry_B_waypoints_normal: [1.1, 0.8, 1.1, 0.2, 0.75, 0.15]   # no use
    pantry_C_waypoints_normal: [0.85, 0.85]   # no use
    pantry_D_waypoints_normal: [1.8, 1.0, 1.3, 1.4]  # 還行
    pantry_E_waypoints_normal: [1.9, 0.8, 1.55, 0.2]   # 很難攻擊所以算了
    pantry_F_waypoints_normal: [2.0, 1.2, 1.53, 0.82]  # 還行
    pantry_G_waypoints_normal: [2.5, 1.4, 1.89, 1.47]   # ignore
    pantry_H_waypoints_normal: [2.25, 0.77]    # finish
    pantry_I_waypoints_normal: [2.7, 0.8, 2.3, 0.15]   # 還行
    pantry_J_waypoints_normal: [2.85, 0.75]    # finish


    # aggressive
    pantry_A_waypoints_aggressive: [0.3, 1.0, 0.1, 0.8]
    pantry_B_waypoints_aggressive: [1.1, 0.8, 1.1, 0.2, 0.7, 0.1] 
    pantry_C_waypoints_aggressive: [0.77, 0.8]   # finish
    pantry_D_waypoints_aggressive: [1.8, 1.1, 1.6, 1.33, 1.2, 1.45]   # 差強人意
    pantry_E_waypoints_aggressive: [2.5, 0.5, 1.45, 0.12]   # finish
    pantry_F_waypoints_aggressive: [2.0, 1.15, 1.8, 1.15, 1.45, 0.8]   # not bad
    pantry_G_waypoints_aggressive: [2.5, 1.4, 1.89, 1.47]   # ignore
    pantry_H_waypoints_aggressive: [2.3, 0.7, 2.1, 0.9]    # 有點怪怪的
    pantry_I_waypoints_aggressive: [2.65, 0.8, 2.2, 0.1]   # 勉強還可以
    pantry_J_waypoints_aggressive: [2.87, 0.9]   # 全部車出去，車一半用 [2.9, 0.8]

sima_strategy:
  ros__parameters:
    sima_id: 3
    max_pantry_to_target: 4
    mission_type: 2    # (1: Peace, 2: Normal, 3: Aggressive)

    fixed_sima_id: 4
    fixed_sima_pantry: "pantry_G"
    fixed_sima_mission: 1

    # pease/normal
    pantry_A_time_normal: 50.0 
    pantry_B_time_normal: 50.0
    pantry_C_time_normal: 50.0
    pantry_D_time_normal: 50.0
    pantry_E_time_normal: 12.0
    pantry_F_time_normal: 10.0
    pantry_G_time_normal: 50.0
    pantry_H_time_normal: 8.0
    pantry_I_time_normal: 9.0
    pantry_J_time_normal: 7.0

    # aggressive
    pantry_A_time_aggressive: 14.3 
    pantry_B_time_aggressive: 14.1
    pantry_C_time_aggressive: 14.2
    pantry_D_time_aggressive: 13.0
    pantry_E_time_aggressive: 12.09
    pantry_F_time_aggressive: 12.12
    pantry_G_time_aggressive: 13.0
    pantry_H_time_aggressive: 7.55
    pantry_I_time_aggressive: 7.45
    pantry_J_time_aggressive: 7.35
