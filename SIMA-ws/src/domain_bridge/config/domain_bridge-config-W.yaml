# Name of the domain bridge, used for node naming and logging
name: my_bridge
from_domain: 14
to_domain: 61
topics:
  # Bridge sima_11/pose/global to multiple domains
  sima_11/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 61

  sima_11/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 62

  sima_11/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 63
  
  sima_11/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 64  
  
  # Bridge sima_12/pose/global to multiple domains
  sima_12/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 61

  sima_12/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 62

  sima_12/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 63

  sima_12/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 64  
  
  # Bridge sima_13/pose/global to multiple domains
  sima_13/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 61

  sima_13/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 62

  sima_13/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 63

  sima_13/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 64  
  
  # Bridge sima_14/pose/global to multiple domains
  sima_14/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 61

  sima_14/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 62

  sima_14/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 63

  sima_14/pose/global:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 64  
  
  # Bridge start signal topic to multiple domains
  robot/startup/sima/start:
    type: std_msgs/msg/Int16
    to_domain: 61
  
  robot/startup/sima/start:
    type: std_msgs/msg/Int16
    to_domain: 62
  
  robot/startup/sima/start:
    type: std_msgs/msg/Int16
    to_domain: 63
  
  robot/startup/sima/start:
    type: std_msgs/msg/Int16
    to_domain: 64

  # Bridge stop signal topic to multiple domains
  robot/startup/sima_game_over:
    type: std_msgs/msg/Bool
    to_domain: 61
    remap: stopRobot 
  
  robot/startup/sima_game_over:
    type: std_msgs/msg/Bool
    to_domain: 62
    remap: stopRobot 
  
  robot/startup/sima_game_over:
    type: std_msgs/msg/Bool
    to_domain: 63
    remap: stopRobot 
  
  robot/startup/sima_game_over:
    type: std_msgs/msg/Bool
    to_domain: 64
    remap: stopRobot 

  # Bridge pantry status topic to sima 1 domain
  /pantry_status:
    type: std_msgs/msg/Int32MultiArray
    to_domain: 61
  
  # Bridge goal assignment topic to multiple domains
  /sima_12/goal:
    type: std_msgs/msg/String
    from_domain: 61
    to_domain: 62
  
  /sima_13/goal:
    type: std_msgs/msg/String
    from_domain: 61
    to_domain: 63
  
  /sima_14/goal:
    type: std_msgs/msg/String
    from_domain: 61
    to_domain: 64
  # # Bridge "/clock" topic from doman ID 2 to domain ID 3
  # clock:
  #   type: rosgraph_msgs/msg/Clock
  # # Bridge "/chatter" topic from doman ID 2 to domain ID 3
  # chatter:
  #   type: example_interfaces/msg/String
  #   # Override QoS reliablity setting to be best effort
  #   # This affects the domain bridge subscription and publisher
  #   # This does NOT affect the other "chatter" bridge below, which is for a different domain
  #   qos:
  #     reliability: best_effort
  # # Also bridge "/chatter" topic from doman ID 2 to domain ID 4
  # chatter:
  #   type: example_interfaces/msg/String
  #   to_domain: 4
  # # Bridge reversed "/chatter" topic
  # chatter:
  #   type: example_interfaces/msg/String
  #   # Reverse 'from' and 'to' domains (bridge from domain ID 3 to domain ID 2)
  #   reversed: True
  # # Bridge bidirectional "/chatter" topic
  # chatter:
  #   type: example_interfaces/msg/String
  #   from_domain: 7
  #   to_domain: 8
  #   # Bridge from domain ID 7 to domain ID 8 AND from domain ID 8 to domain ID 7
  #   bidirectional: True

  # # Bridge "/chatter" topic from doman ID 2 to domain ID 3, but as "/chitter"
  # chatter:
  #   type: example_interfaces/msg/String
  #   remap: chitter