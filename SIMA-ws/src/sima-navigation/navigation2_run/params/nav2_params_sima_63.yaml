      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: False
      width: 3
      height: 2
      resolution: 0.01
      robot_radius: 0.075
      # unknown_cost_value: 0
      # plugins: ["static_layer", "sensor_layer", "inflation_layer"]
      # plugins: ["static_layer", "inflation_layer"]
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: False
      # sensor_layer:
      #   plugin: "Sensor_costmap_plugin::SensorLayer"
      #   enabled: True
      #   obstacle_radius: 0.01
      #   inflation_radius: 0.5
      # inflation_layer:
      #   plugin: "nav2_costmap_2d::InflationLayer"
      #   cost_scaling_factor: 5.0
      #   inflation_radius: 0.2

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.075
      resolution: 0.01
      track_unknown_space: false
      trinary_costmap: false
      lethal_cost_threshold: 10
      unknown_cost_value: 255
      plugins:
        [
          "static_layer",
          "obstacle_layer",
          "sima_pantry_layer",
          "inflation_layer",
          # "sensor_layer",
          "sima_layer",
          # "rival_layer",
          # "object_layer",
          # "keepout_layer",
        ]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: True
      #   observation_sources: fake_obstacle

      #   fake_obstacle:
      #     topic: /detected_obstacles
      #     max_obstacle_height: 2.0
      #     clearing: True
      #     marking: True
      #     data_type: "PointCloud2"
      #     raytrace_max_range: 3.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: vl53_scan  # 宣告資料來源名稱
        
        vl53_scan:
          topic: /sensors/vl53_scan
          data_type: "LaserScan"
          marking: True    # 負責將範圍內的點畫成障礙物
          clearing: True   # 負責射線追蹤，清除沒有障礙物的區域 (解決殘影！)
          raytrace_max_range: 0.55  # 射線追蹤清除殘影的最大距離 (稍微大於你的 trigger_distance)
          obstacle_max_range: 0.45  # 記錄為障礙物的最大距離
          obstacle_min_range: 0.0
          inf_is_valid: True       # 【極度關鍵】這告訴 Nav2，當讀取到 inf 時，代表前方是空曠的，請把殘影清掉
      sima_pantry_layer:
        plugin: "sima_pantry_costmap_plugin::SimaPantryLayer"
        enabled: True
        sima_id: 13
        pantry_names: ["pantry_A", "pantry_B", "pantry_C", "pantry_D", "pantry_E", "pantry_F", "pantry_G", "pantry_H", "pantry_I", "pantry_J"]
        # 定義格式: [min_x, min_y, max_x, max_y]
        pantry_A_zone: [0.0, 0.7, 0.2, 0.9]
        pantry_B_zone: [0.6, 0.0, 0.8, 0.2]
        pantry_C_zone: [0.7, 0.7, 0.9, 0.9]
        pantry_D_zone: [1.15, 1.35, 1.35, 1.55]
        pantry_E_zone: [1.4, 0.0, 1.6, 0.2]
        pantry_F_zone: [1.4, 0.7, 1.6, 0.9]
        pantry_G_zone: [1.65, 1.35, 1.85, 1.55]
        pantry_H_zone: [2.1, 0.7, 2.3, 0.9]
        pantry_I_zone: [2.2, 0.0, 2.4, 0.2]
        pantry_J_zone: [2.8, 0.7, 2.99, 0.9]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0
        inflation_radius: 0.12
      sensor_layer:
        plugin: "Sensor_costmap_plugin::SensorLayer"
        enabled: False
        obstacle_radius: 0.02
        inflation_radius: 0.12
        cost_scaling_factor: 2.0
        obstacle_lifespan: 4.0
        sima_id: 13
        # pantry range
        # ignore_zone_array: [min_x, min_y, max_x, max_y]
        # ignore_zone_array: [0.5, 0.4, 2.0, 1.5      # test
        #                     ]

      sima_layer:
        plugin: "SIMA_costmap_plugin::SIMALayer"
        enabled: True
        sima_radius: 0.075
        inflation_radius: 0.08
        cost_scaling_factor: 3.0
        sima_id: 13
        tolerance_timeout: 1.0 # seconds to consider sima pose valid
      rival_layer:
        plugin: "custom_path_costmap_plugin::RivalLayer"
        enabled: True
        model_size: 22
        x_cov_threshold: 0.02
        y_cov_threshold: 0.02
        R_sq_threshold: 0.85
        reset_timeout_threshold: 70
        robot_inscribed_radius: 0.3
        # external_rival_data_path: "/home/user/Eurobot-2025-Navigation2-ws/src/Eurobot-2025-Navigation2/custom_layer/rival_layer/params/rival_param.yaml"
        rival_inscribed_radius: 0.22
        halted_inflation_radius: 0.1
        wandering_inflation_radius: 0.12
        moving_inflation_radius: 0.1
        unknown_inflation_radius: 0.12
        halted_cost_scaling_factor: 10.0
        wandering_cost_scaling_factor: 10.0
        moving_cost_scaling_factor: 0.9
        unknown_cost_scaling_factor: 10.0
        max_extend_length: 0.6
        cov_range_max: 0.05385164807134504 # sqrt(0.0029)
        cov_range_min: 0.01414213562373095 # sqrt(0.0002)
        vel_range_max: 1.0
        vel_range_min: 0.0
        inscribed_radius_rate: 0.99
        inflation_radius_rate: 1.005
        debug_mode: 0 # 0: off, 1: Print rival state change only, 2: Print rival state change and statistics, 3: Print everything continuously
        use_statistic_method: False
        offset_vel_factor_weight_statistic: 0.42
        expand_vel_factor_weight_statistic: 0.42
        offset_vel_factor_weight_localization: 0.42
        expand_vel_factor_weight_localization: 0.42
        safe_distance: 0.5
      object_layer:
        plugin: "Object_costmap_plugin::ObjectLayer"
        enabled: True
        column_inscribed_radius: 0.075
        board_inscribed_radius: 0.01
        column_inflation_radius: 0.22
        board_inflation_radius: 0.22
        cost_scaling_factor: 3.0
        base_frame: "base_link" # added
      keepout_layer:
        plugin: "keepout_costmap_plugin::KeepoutLayer"
        enabled: False
        # keepout_zone_array: [X, Y, lengthX, lengthY]
        # keepout_zone_array: [0.375, 1.775, 0.45, 0.45,  # A
        #                      0.225, 0.875, 0.45, 0.45,  # B
        #                      0.225, 0.075, 0.45, 0.15,  # C
        #                      0.775, 0.075, 0.45, 0.15,  # D
        #                      1.225, 0.225, 0.45, 0.45,  # E
        #                      #----------------------------#
        #                      1.775, 0.225, 0.45, 0.45,  # F
        #                      2.225, 0.075, 0.45, 0.15,  # G
        #                      2.775, 0.075, 0.45, 0.15,  # H
        #                      2.775, 0.875, 0.45, 0.45,  # I
        #                      2.625, 1.775, 0.45, 0.45,] # J
        keepout_zone_array: [
            0.1,
            0.8,
            0.2,
            0.2, # A
            0.7,
            0.1,
            0.2,
            0.2, # B
            0.8,
            0.8,
            0.2,
            0.2, # C
            1.25,
            1.45,
            0.2,
            0.2, # D
            #-----------------------------#
            1.5,
            0.1,
            0.2,
            0.2, # E
            1.5,
            0.8,
            0.2,
            0.2, # F
            #-----------------------------#
            1.75,
            1.45,
            0.2,
            0.2, # G
            2.2,
            0.8,
            0.2,
            0.2, # H
            2.3,
            0.1,
            0.2,
            0.2, # I
            2.9,
            0.8,
            0.2,
            0.2, # J
            #-----------------------------#
            0.175,
            0.4,
            0.15,
            0.2, # K
            0.175,
            1.2,
            0.15,
            0.2, # L
            1.1,
            0.175,
            0.2,
            0.15, # M
            1.15,
            0.8,
            0.2,
            0.15, # N
            #-----------------------------#
            2.825,
            0.4,
            0.15,
            0.2, # O
            2.825,
            1.2,
            0.15,
            0.2, # P
            1.9,
            0.175,
            0.2,
            0.15, # Q
            1.85,
            0.8,
            0.2,
            0.15,
          ] # R
        inflation_length: 0.15
        cost_scaling_factor: 5.0
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "basic_map.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    costmap_wait_timeout: 1.0
    use_sim_time: False
    use_omnidirectional_robot: false
    planner_plugins: ["GridBased_Aggressive", "GridBased_Pease"]
    GridBased_Aggressive:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.02
      use_astar: True
      allow_unknown: true
    
    GridBased_Pease:
      # plugin: "nav2_navfn_planner/NavfnPlanner"
      # tolerance: 0.02
      # use_astar: True
      # allow_unknown: true
      

      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.02
      allow_unknown: true
      
      # 🌟 【防鑽縫神器】：懲罰係數
      # 數值越大，Planner 越討厭 Inflation 區域，會強制讓路徑保持在通道正中央
      cost_penalty: 30.0 
      
      # 距離與成本的權重比例
      cost_travel_multiplier: 15.0
      
      # 平滑化設定，讓路徑不要像鋸齒狀
      smoother_max_iterations: 10
      smoother_on_update: True
      smoother_do_refinement: True

      max_planning_time: 1.5 # Smac 內建的超時機制，絕對不會死鎖！
      use_final_approach_orientation: false

      

      # plugin: "nav2_smac_planner/SmacPlanner2D"
      # tolerance: 0.02
      # use_astar: true
      # allow_unknown: false

      # cost_travel_multiplier: 5.0 # larger values -> more obstacle avoidance
      # downsample_costmap: false # set to true to downsample costmap for planning
      # downsampling_factor: 4 # factor by which to downsample costmap (example 2 -> half size in each dimension)
      # debug_visualizations: false # set to true to enable visualizations in Rviz
      # # to improve performance, set to true to enable smac planner to use
      # smooth_path: true
      # smooth_path_weight: 0.1
      # smooth_path_iterations: 50
      # smooth_path_tolerance: 1e-6
      # smoother_max_iterations: 10
      # smoother_on_update: True
      # smoother_do_refinement: True
      # # model parameters
      # motion_model_for_search: "DIFF" # "DIFF" or "OMNI"
      # cost_penalty: 50.0 # penalty for too close to obstacles
      # # no need to change
      # max_iterations: 20000
      # max_on_approach_iterations: 1000

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait", "escape", "shrink", "spin", "backup"]
    escape:
      plugin: "nav2_behaviors/Escape"
    wait:
      plugin: "nav2_behaviors/Wait"
    shrink:
      plugin: "nav2_behaviors/Shrink"
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.44, 30.0]
    min_velocity: [-0.6, -0.44, -30.0]
    max_accel: [1.0, 0.25, 150.0]
    max_decel: [-3.0, -1.6, -150.0]
    odom_topic: "/odom/wheel"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.1 # must be less than velocity_smoother_wait in docking_server

docking_server:
  ros__parameters:
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 3.0
    max_retries: 0
    base_frame: "base_link"
    fixed_frame: "map"
    dock_backwards: false
    dock_prestaging_tolerance: 0.01
    velocity_smoother_wait: 0.12

    # Types of docks
    dock_plugins: ["dock"]
    dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.005
      use_debounce: true
      xy_debounce_threshold: 2
      yaw_debounce_threshold: 2
      use_dynamic_offset: true
      staging_x_offset: 0.35
      staging_y_offset: 0.35
      staging_yaw_offset: 1.57
      use_battery_status: false
      use_stall_detection: false
      base_frame: "base_link"

    docks: ["home_dock"]
    home_dock:
      type: "dock"
      frame: map
      pose: [0.0, 0.0, 0.0]

    # dock_database: /my/path/to/dock_database.yaml

    controllers: ["Ordinary", "Gentle", "Rush"]

    Ordinary:
      max_linear_vel: 0.3
      min_linear_vel: 0.0
      linear_kp_accel_vel: 0.5
      linear_ki_accel_vel: 0.1
      linear_kp_decel_dis: 3.0
      angular_kp: 4.0
      deceleration_distance: 0.05
      reserved_distance: 0.0
      stop_degree: 120.0
      rival_radius: 0.44

    Gentle:
      max_linear_vel: 0.3
      min_linear_vel: 0.0
      linear_kp_accel_vel: 0.5
      linear_ki_accel_vel: 0.1
      linear_kp_decel_dis: 3.0
      angular_kp: 4.0
      deceleration_distance: 0.1
      reserved_distance: 0.0
      stop_degree: 120.0
      rival_radius: 0.44

    Rush:
      max_linear_vel: 0.3
      min_linear_vel: 0.0
      linear_kp_accel_vel: 0.5
      linear_ki_accel_vel: 0.1
      linear_kp_decel_dis: 3.0
      angular_kp: 4.0
      deceleration_distance: 0.03
      reserved_distance: 0.0
      stop_degree: 120.0
      rival_radius: 0.44

vl53_bridge:
  ros__parameters:
    # 信任區間與記憶
    min_trust_dist: 0.05
    max_trust_dist: 0.45
    memory_duration: 0.05
    
    # 虛擬光達調校參數
    raytrace_max_range: 2.5       # 必須大於 Costmap ObstacleLayer 裡的 raytrace_max_range
    half_fov_mark_deg: 3.0        # 畫牆寬度 (度)，越小牆越精緻
    half_fov_clear_deg: 13.5      # 清除寬度 (度)，建議符合感測器真實物理視角的一半
    gap_fill_tolerance: 0.1       # 智能補點判定距離差 (公尺)，如果場地牆壁斜率較大可以稍微調高
    smear_rays: 3                 # 牆壁加厚塗抹強度 (條數)

final_pose_bridge:
  ros__parameters:
    # twist_topic: "/driving_duaiduaiduai"
    twist_topic: "/odoo_googoogoo"
