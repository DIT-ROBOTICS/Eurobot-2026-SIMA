ControllerSelector:
  ros__parameters:
    Diff_controller: "Diff"

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    holonomic: False
    use_omnidirectional_robot: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["Precise", "Unerring", "Loose"]
    controller_plugins: ["Diff", "Diff_Aggressive", "special_Diff"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.01
      movement_time_allowance: 3.0

    # Goal checker parameters
    Precise:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.05
      xy_debounce_threshold: 1
      yaw_debounce_threshold: 1

    Unerring:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.05
      xy_debounce_threshold: 5
      yaw_debounce_threshold: 5

    Loose:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      # yaw_goal_tolerance: 0.07
      yaw_goal_tolerance: 3.14
      xy_debounce_threshold: 1
      yaw_debounce_threshold: 1

    # Controller parameters
    Diff:
      plugin: "diff_controller::DiffController"
      desired_linear_vel: 0.55
      lookahead_dist: 0.25
      max_angular_vel: 3.0
      min_linear_vel: 0.0
      min_approach_linear_vel: 0.01
      approach_dist: 0.5
      transform_tolerance: 0.1
      heading_rotate_threshold: 0.6 # rad, about 46 degrees
      heading_slowdown_threshold: 0.3 # rad, about  degrees
      heading_kp: 2.0
      min_turning_linear_vel: 0.01
      max_acc_linear: 0.2 # m/s^2
      max_acc_angular: 6.0 # rad/s^2
      max_decel_linear: 2.2 # m/s^2
      max_decel_linear_emergency: 4.0 # m/s^2
      max_decel_angular: 8.0 # rad/s^2
      curvature_weight: 0. # weight for curvature in cost function
      # allow_unknown: True
    
    Diff_Aggressive:
      plugin: "diff_controller::DiffController"
      desired_linear_vel: 0.6
      lookahead_dist: 0.30
      max_angular_vel: 2.4
      min_linear_vel: 0.0
      min_approach_linear_vel: 0.01
      approach_dist: 0.35
      transform_tolerance: 0.1
      heading_rotate_threshold: 0.8 # rad, about 46 degrees
      heading_slowdown_threshold: 0.5 # rad, about  degrees
      heading_kp: 2.2
      min_turning_linear_vel: 0.01
      max_acc_linear: 0.3 # m/s^2
      max_acc_angular: 5.0 # rad/s^2
      max_decel_linear: 1.8 # m/s^2
      max_decel_linear_emergency: 2.0 # m/s^2
      max_decel_angular: 6.0 # rad/s^2
      curvature_weight: 0.3 # weight for curvature in cost function
    
    special_Diff:
      plugin: "special_diff_controller::SpecialDiffController"
      
      # === 基本速度與距離 ===
      desired_linear_vel: 0.4
      lookahead_dist: 0.15        # [注意] 建議調大 (原本是 0.15)。看遠一點可以濾掉路徑上細碎的折線，讓狀態機不會瘋狂切換。
      max_angular_vel: 2.4
      min_approach_linear_vel: 0.05 # 靠近終點時的最小蠕行速度
      approach_dist: 0.50
      min_approach_linear_vel: 0.05
      transform_tolerance: 0.1

      # === 狀態機切換門檻 (Hysteresis) 核心區 ===
      # 這是決定你的機器人會不會「抽搐」的關鍵
      heading_error_threshold_to_rotate: 0.20  # rad (約 8.5 度)。當前進時，偏離超過這個角度，強制煞車進入旋轉狀態。
      heading_error_threshold_to_drive: 0.05   # rad (約 2.8 度)。當旋轉時，必須對準到誤差小於這個角度，才允許踩油門前進。

      # === 控制增益 (Kp) ===
      heading_kp: 1.5                # 原地旋轉時對準目標的 P Gain (沿用你原本的數值)
      straight_correction_kp: 1.2    # [新參數] 走直線時的 P Gain。用來微調馬達左右不平衝導致的走歪，不能設太大，否則會變蛇行。

      # === 加減速限制 (Slew Rate) ===
      # 沿用你原本的設定，這對保護實體車的機構很有幫助
      max_acc_linear: 0.2         # m/s^2
      max_acc_angular: 5.0         # rad/s^2
      max_decel_linear: 2.8        # m/s^2
      max_decel_linear_emergency: 4.0 # m/s^2 (遇到障礙物時的煞車力度)
      max_decel_angular: 6.0       # rad/s^2

      # plugin: "teb_controller::TebController"

      # # === TEB params ===
      # dt_ref: 0.1 # Time resolution, smaller is more precise but computationally heavier
      # resample_ds: 0.01 # Path point spacing (m)
      # iterations: 3 # Number of optimization iterations, at least 3 recommended for better convergence

      # # Obstacle avoidance parameters
      # min_obstacle_dist: 0.22 # [Adjusted] Match your robot radius 0.075, leave some margin (original 0.25 was too large)
      # w_smooth: 1.0 # Increase smoothing weight for smoother paths
      # w_obst: 2.0
      # step_size: 0.01

      # # Prediction parameters
      # lookahead_dist: 0.15 # How far ahead to look for control force calculation (about 2-3 times the robot length)

      # # Control gains (similar to PID)
      # k_xy: 2.0
      # k_w: 0.5

      # # Goal behavior
      # goal_xy_stop_dist: 0.01
      # goal_heading_switch_dist: 0.3 # When to start adjusting final heading based on distance to goal

      # # Velocity limits (match with your velocity_smoother)
      # max_v: 0.4 # Slightly reduced for testing, increase to 1.5 once stable
      # min_v: 0.0
      # max_w: 1.5
      # max_acc_v: 0.4 # Acceleration limits
      # max_acc_w: 0.75 # Angular acceleration limits

      # # Costmap related
      # max_cost_threshold: 100.0 # Try to plan as long as it's below this cost
      # blocked_stop_clearance: 0.3
      # treat_no_info_as_obstacle: false
      # cost_check_stride: 1

      # # Stop condition
      # stop_v_eps: 0.01

      # # Replanning mechanism
      # replan_min_blocked_time: 0.5
      # replan_cooldown: 0.2

